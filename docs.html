<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Astrogramm</title>
<style>@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/onest-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/onest-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:'Onest';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/onest-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/onest-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
:root{color-scheme:dark;--bg:#0a0820;--surface:#151033;--surface-2:#1f1842;--line:rgba(201,169,74,.22);
--line-soft:rgba(236,231,246,.08);--gold:#e9c46a;--gold-light:#ffd76b;--text:#ece7f6;--text-2:#d9d3ea;
--muted:#a097c3;--font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
--font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font-body)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;
padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font:600 24px/1 var(--font-display);color:var(--gold-light);letter-spacing:.02em;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{color:var(--text-2);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid var(--line-soft)}
nav a[aria-current=page]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.lang{font-size:13px;color:var(--muted)}
.lang a{color:var(--gold);text-decoration:none;margin-left:6px}
.lang a[aria-current=true]{color:var(--text);font-weight:600;pointer-events:none}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:36px;color:var(--gold-light);margin:28px 0 6px}
h2{font-size:26px;color:var(--gold);margin:36px 0 10px}
h3{font-size:20px;margin:24px 0 8px}
p,li{color:var(--text-2)}
a{color:var(--gold-light)}
strong{color:var(--text)}
ul,ol{padding-left:22px}
li{margin:4px 0}
blockquote{margin:16px 0;padding:12px 16px;background:var(--surface);border-left:3px solid var(--gold);border-radius:0 12px 12px 0}
blockquote p{margin:0;color:var(--text)}
.table{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
th{background:var(--surface-2);color:var(--gold);font-weight:600}
tr:last-child td{border-bottom:0}
code{font-size:.92em;background:var(--surface);padding:1px 5px;border-radius:6px}
.draft{background:#5a1f1f;color:#fff;padding:10px 14px;border-radius:12px;margin-top:16px;font-weight:600}
.ph{background:#7a2a2a;color:#fff;border-radius:4px;padding:0 3px}
footer{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.cards{display:grid;gap:12px;margin-top:20px}
.cards a{display:block;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
color:var(--text);text-decoration:none;font:600 20px var(--font-display)}
.cards a span{display:block;font:400 13px var(--font-body);color:var(--muted);margin-top:4px}
@media (max-width:420px){h1{font-size:30px}h2{font-size:23px}}
</style>
</head>
<body><div class="wrap"><header><span class="brand">Astrogramm</span></header><main><h2>Документы приложения Astrogramm</h2><div class="cards"><a href="ru/privacy.html">Конфиденциальность<span>Русский</span></a><a href="ru/terms.html">Условия<span>Русский</span></a><a href="ru/support.html">Поддержка<span>Русский</span></a></div><h2>Документи застосунку Astrogramm</h2><div class="cards"><a href="uk/privacy.html">Конфіденційність<span>Українська</span></a><a href="uk/terms.html">Умови<span>Українська</span></a><a href="uk/support.html">Підтримка<span>Українська</span></a></div></main></div></body>
</html>
