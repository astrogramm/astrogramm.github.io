<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Відкриття карти — сцена v3</title>
<!-- Тестовая страница сцены «Открытие карты» v3. Весь код сцены — app/v12/reveal3.js (тот же файл вшивается в приложение make_v12.py),
     стили — app/v12/orb.css, раздел «Открытие карты» v3 (здесь — копия rv3.css, делает sync.py). Слои — layers/ (= app/assets/illustrations/reveal),
     вырезки — cut/ (= app/assets/illustrations/name/cut). ?c=<ветвь>_<печать> — любой из 240; ?rec=1 — запись кадров (rec.py, frames.py); ?fps — счётчик. -->
<style>
@font-face{font-family:'Ysabeau';font-weight:300;src:url(ysabeau-cyrillic-300-normal.woff2)}
@font-face{font-family:'Ysabeau Office';font-weight:500;src:url(ysabeau-office-cyrillic-500-normal.woff2)}
@font-face{font-family:'Unbounded';font-weight:300;src:url(unbounded-cyrillic-300-normal.woff2)}
:root{--font-display:'Ysabeau',serif;--font-body:'Ysabeau Office',sans-serif;--font-num:'Unbounded',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#040209;overflow:hidden}
#play{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#040209;font:300 22px var(--font-display);color:#F1DFA6;z-index:9;border:0;width:100%}
#play small{font:500 12px var(--font-body);letter-spacing:.14em;color:#8f84ad}
#fps{position:fixed;left:10px;top:10px;font:11px monospace;color:#6d6488;pointer-events:none;z-index:8}
</style>
<link rel="stylesheet" href="rv3.css">
</head><body>
<div id="reveal" class="rv rv3"><div class="rv3st" id="st"></div></div>
<div id="fps"></div>
<button id="play" type="button">Відкрити карту<small>ЗІ ЗВУКОМ</small></button>
<script src="reveal3.js"></script>
<script>
const Q=new URLSearchParams(location.search), REC=Q.has('rec'), CK=(Q.get('c')||'yin_13').replace(/[^a-z0-9_]/g,'');
// данные ядра для карты основателя (chart.py 05.06.1997 05:10 Харьков); в приложении — W3.rvData(a)
const NAMES={ yin_13:{name:'Тигр-Мандрівник', sub:'Земляний Тигр · Небесний Мандрівник', act:'Прокладаєш шлях там, де дороги ще немає, і розповідаєш про нього.', seal:13},
              chen_04:{name:'Дракон-Розквіт', sub:'Дракон · Жовте Зерно', act:'Садиш ідею й терпляче доводиш її до плоду.', seal:4} };
const X=Object.assign({name:'Ім’я карти', sub:'підпис · печать', act:'Дія карти — текст із ядра.', seal:13, birth:'05.06.1997 · 05:10', city:'Харків', asc:83.718,
  planets:[['sun',74.47,1],['moon',71.94,.74],['mercury',53.54,.86],['venus',91.11,.86],['mars',174.34,1],['jupiter',321.9,1],['saturn',17.69,1],['uranus',308.46,.78],['neptune',299.66,.9],['pluto',243.94,.9]]}, NAMES[CK]||{});
const W=RV3.W, sc=REC?1:Math.max(.2,innerWidth/W), H=REC?768:Math.round(Math.min(1000,Math.max(768,innerHeight/sc)));
const st=document.getElementById('st'); st.style.width=W+'px'; st.style.height=H+'px'; st.style.transform='scale('+sc+')';
const el=document.getElementById('reveal'); let api=null;
window.ready=fetch('layers/chars.json').then(r=>r.json()).then(ch=>{
  api=RV3.run({root:st,base:'layers/',charSrc:'cut/name_'+CK+'.webp',charSize:ch[CK]||[600,900],sealSrc:'seal_'+String(X.seal).padStart(2,'0')+'.webp',X:X,H:H,rec:REC,audioSrc:REC?null:'reveal.m4a',
    txt:{sky:'Небо в мить твого народження',eight:'Вісім систем — одна карта',kick:'ІМ’Я ТВОЄЇ КАРТИ',btn:'Відкрити мою карту',skip:'пропустити'}});
  window.render=api.render; return api.ready; }).then(()=>{ api.render(0); el.classList.add('on');
  if(REC){ document.getElementById('play').remove(); return; }
  const play=document.getElementById('play');
  play.addEventListener('click',()=>{ play.style.display='none'; if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(()=>{}); st.classList.remove('done'); api.done=false; api.start(0); if(Q.has('fps')) fpsLoop(); });
  st.querySelector('.rvbtn').addEventListener('click',()=>{ api.stop(); play.style.display='flex'; play.firstChild.textContent='Ще раз'; try{ api.au=new Audio('reveal.m4a'); }catch(e){} api.render(0); });
  addEventListener('resize',()=>{ const s=Math.max(.2,innerWidth/W); st.style.transform='scale('+s+')'; });
});
// замер (?fps): кадров в секунду и худший кадр — для шага «скорость на телефоне»
function fpsLoop(){ let fr=0, last=performance.now(), mark=last, worst=0; (function f(){ const now=performance.now(); worst=Math.max(worst,now-last); last=now; if(++fr%60===0){ document.getElementById('fps').textContent=(60000/(now-mark)).toFixed(0)+' fps · найгірший кадр '+worst.toFixed(0)+' мс'; mark=now; worst=0; } if(api.run) requestAnimationFrame(f); })(); }
</script></body></html>
