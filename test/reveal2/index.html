     Слои Gemini (layers/): фон, круг неба, фонарь выкл/вкл, туман 3 канала, вспышка+пыль; круг собирается кодом по данным ядра

     видео (rec.py: Playwright → ffmpeg) и держится синхрон со звуком (sound.py). ?c=chen_04 — другой персонаж; ?rec=1 — запись; ?fps — счётчик. -->

<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uPlate, uChar, uSky, uLant, uFog, uFx;
uniform float uT, uAsp, uLight, uSil, uRev, uFlash, uFogA, uLan, uZoom, uDust, uAmb, uS, uSc, uCardA, uWind, uBreath, uSkyA, uLantA, uLantOn, uSpark;
uniform vec2 uPar, uC, uRes, uL, uM; uniform vec4 uRect, uSkyRect, uLantRect;
float rbox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec2 L = uL;
  vec2 drift = vec2(sin(uT*.21)*.004, cos(uT*.17)*.003);
  vec2 uvP = uM + (vUv-uC)/uS;   // uM: экран (=uC, фон во весь экран) → карта (=.5, в рамке весь фон)
  vec2 uv = L + (uvP-L)/uZoom + drift;
  vec2 q = (uv-L)*vec2(uAsp,1.); float d = length(q);
  // карта: снаружи — ночь и свечение, по краю — золотая рамка
  float sdf = rbox((vUv-uC)*uRes, vec2(uS*uRes.x*.5, uS*uRes.y*.5), 18.);
  float outside = uCardA*step(0.,sdf);
  float fl = .9+.1*sin(uT*9.)*sin(uT*5.3+1.)+.05*sin(uT*23.);
  // неровная кромка света — из текстуры тумана (дёшево, без шума в шейдере)
  float n = texture2D(uFog, uv*vec2(1.3,2.2)+vec2(uT*.01,0.)).r;
  // фон: свет огонька «дотягивается» до неба и скалы
  vec3 plate = texture2D(uPlate, uv + uPar*.004).rgb;
  float light = smoothstep(uLight, uLight*.3, d + (n-.5)*.16);
  float inPl = step(0.,uv.x)*step(uv.x,1.)*step(0.,uv.y)*step(uv.y,1.);   // за краем фона — ночь, не растяжка
  vec3 col = plate*(light*(.82+.18*fl) + uAmb)*inPl;
  // круг неба (слой Gemini + планеты на градусах, canvas → текстура): проявляется светом
  { vec2 suv=(uv-uSkyRect.xy)/uSkyRect.zw; if(uSkyA>0. && suv.x>0. && suv.x<1. && suv.y>0. && suv.y<1.){ vec4 sk=texture2D(uSky,suv+uPar*.003);
      col = mix(col, sk.rgb*(.75+.35*light+.3*uLan*exp(-d*2.5)), sk.a*uSkyA); } }
  // огонёк и свечение фонаря
  col += vec3(1.,.42,.18)*uLan*fl*(.34*exp(-d*13.)+.10*exp(-d*3.6));
  col += vec3(1.,.78,.5)*uSpark*(fl*.9*exp(-d*d*9000.)+.5*exp(-d*60.)+.12*exp(-d*9.));
  // фонарь: отдельный слой (выкл → вкл), висит у огонька
  { vec2 luv=(uv-uLantRect.xy)/uLantRect.zw; if(uLantA>0. && luv.x>0. && luv.x<1. && luv.y>0. && luv.y<1.){
      luv.x += .004*sin(uT*1.3)*(luv.y); vec4 lo=texture2D(uLant, vec2(luv.x, luv.y*.5)); vec4 ln=texture2D(uLant, vec2(luv.x, .5+luv.y*.5));
      vec4 lt=mix(lo,ln,uLantOn); vec3 lc=lt.rgb*(.35+.65*light+uAmb+.5*uLantOn); col = mix(col, lc, lt.a*uLantA); } }
  col = mix(col, vec3(.016,.009,.035)+vec3(.85,.72,.4)*.22*exp(-max(sdf,0.)/38.), outside);
  float ring = uCardA*(smoothstep(1.6,.4,abs(sdf))*.9 + smoothstep(1.2,.3,abs(sdf+6.))*.45);
  col = mix(col, vec3(.85,.72,.40), ring);
  { vec2 sp=(uv-vec2(uRect.x+uRect.z*.5, uRect.y+uRect.w*.985))/vec2(uRect.z*.62, uRect.w*.035); col*=1.-.6*uSil*exp(-dot(sp,sp)*1.6)*(1.-outside); }
  // персонаж: настоящая картинка карты; силуэт, контровой контур и проявление считает шейдер
  vec2 feet = vec2(uRect.x+uRect.z*.5, uRect.y+uRect.w);
  vec2 feetScr = uC + (feet-uM)*uS, dC = feetScr - (uC + (feet-uM)*uSc);
  vec2 uvC = L + ((uM + (vUv-dC-uC)/uSc) - L)/uZoom + drift;
  vec2 cuv = (uvC - uRect.xy)/uRect.zw + uPar*.010;
  cuv.y = 1. - (1.-cuv.y)*(1.+uBreath*.012*sin(uT*1.5));
  float wmask = smoothstep(.38,.92,cuv.y)*smoothstep(1.,.93,cuv.y);
  cuv.x += uWind*wmask*(.010*sin(cuv.y*9.-uT*2.1) + .006*sin(cuv.y*17.+uT*3.3) + .004*sin(uT*.7));
  if(uSil>0. && cuv.x>0. && cuv.x<1. && cuv.y>0. && cuv.y<1.){
    vec4 c = texture2D(uChar, cuv);
    vec2 dir = normalize((L-uv)*vec2(uAsp,1.))/uRect.zw*vec2(1./uAsp,1.);
    float rim = clamp(c.a - texture2D(uChar, cuv+dir*.011).a, 0., 1.);
    float rim2 = clamp(c.a - texture2D(uChar, cuv+dir*.03).a, 0., 1.);
    float rev = uRev<.01 ? 0. : smoothstep(uRev, uRev*.5, d + (n-.5)*.26);
    vec3 lit = c.rgb*vec3(1.,.93,.84)*(.50+.62*exp(-d*2.4))*mix(1.,.62,smoothstep(.55,1.,cuv.y));
    vec3 sil = c.rgb*.05*vec3(.8,.7,1.) + vec3(.020,.012,.032);
    vec3 cc = mix(sil, lit, rev);
    cc += (rim*1.1+rim2*.45)*vec3(1.,.66,.34)*max(uLan,.7)*fl*mix(1., .2, rev)*exp(-d*1.1);
    float edge = smoothstep(uRev*.5, uRev*.78, d+(n-.5)*.26)*smoothstep(uRev*1.05, uRev*.8, d+(n-.5)*.26);
    cc += vec3(1.,.8,.45)*edge*.5*step(.02,uRev)*step(uRev,2.4);
    float feetF = smoothstep(1., .9, cuv.y);
    col = mix(col, cc, c.a*uSil*feetF);
  }
  // туман перед ногами: три слоя Gemini (каналы R/G/B), подсвечен огоньком
  float band = smoothstep(.50,.98,uv.y);
  float fy = (uv.y-.45)/.6;
  float fa = texture2D(uFog, vec2(uv.x*.75 - uT*.016, fy*.8+.1)).r;
  float fb = texture2D(uFog, vec2(uv.x*.6 + uT*.011 + .3, fy*.9)).g;
  float fc = texture2D(uFog, vec2(uv.x*.5 - uT*.008 + .6, fy*.7+.25)).b;
  float fog = clamp(fa*.45 + fb*.55 + fc*.75*smoothstep(.6,1.,uv.y), 0., 1.)*band;
  vec3 fogc = vec3(.40,.34,.50)*(.10+.75*light+uAmb) + vec3(1.,.5,.25)*.22*exp(-d*3.2)*uLan;
  col = mix(col, fogc, fog*uFogA*.8*(1.-outside));
  // золотая пыль — слой Gemini в два прохода
  if(uDust>0.){ float du = texture2D(uFx, uv*vec2(1.2,2.1)+vec2(uT*.012,-uT*.02)).g + texture2D(uFx, uv*vec2(2.0,3.5)+vec2(-uT*.008,-uT*.035)).g*.7;
    col += vec3(1.,.8,.45)*du*uDust*(.55+.45*sin(uT*4.+uv.x*30.))*(1.-outside)*exp(-d*1.2); }
  // вспышка — лучи Gemini от огонька
  if(uFlash>0.){ vec2 buv = q/(.55+.9*uFlash) + .5; float br = texture2D(uFx, buv).r*step(0.,buv.x)*step(buv.x,1.)*step(0.,buv.y)*step(buv.y,1.);
    col += vec3(1.,.80,.52)*uFlash*(br*1.3 + exp(-d*(5.-3.4*uFlash))*1.1);
    col = mix(col, vec3(1.,.93,.80), uFlash*uFlash*.20*exp(-d*.9)); }
  col *= 1.-.30*smoothstep(.45,1.1,length((vUv-.5)*vec2(.9,1.1)));
  col += (h(vUv*800.+uT)-.5)*.018;
  gl_FragColor = vec4(col,1.);
}
</script>
<script>
const Q=new URLSearchParams(location.search), REC=Q.has('rec'), CK=Q.get('c')==='chen_04'?'chen_04':'yin_13';
const CARD={ yin_13:{name:'Тигр-Мандрівник', sub:'Земляний Тигр · Небесний Мандрівник', act:'Прокладаєш шлях там, де дороги ще немає, і розповідаєш про нього.', seal:'seal_13.webp', asp:566/891, h:.46, cx:.62, by:.77},
             chen_04:{name:'Дракон-Розквіт', sub:'Дракон · Жовте Зерно', act:'Садиш ідею й терпляче доводиш її до плоду.', seal:'seal_04.webp', asp:600/1025, h:.46, cx:.62, by:.77} }[CK];
// небо рождения — данные ядра (chart.py, карта основателя 05.06.1997 05:10 Харьков); в приложении — rvData.planets / rvData.asc
const SKY={asc:83.718, planets:[['sun',74.47,1],['moon',71.94,.74],['mercury',53.54,.86],['venus',91.11,.86],['mars',174.34,1],['jupiter',321.9,1],['saturn',17.69,1],['uranus',308.46,.78],['neptune',299.66,.9],['pluto',243.94,.9]]};
const PL=['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'];
const SYS=['natal','bazi','matrix','hd','num','fengshui','jyotish','tzolkin'];
const $=id=>document.getElementById(id), W=432, H=768, DUR=13.4;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{ const c=1.70158; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
// ---------- геометрия сцены в uv фона (768×1376): огонёк, круг неба, фонарь, персонаж
const PA=768/1376;                         // uv.x → uv.y для квадрата
const L=[.35,.45];                         // огонёк / огонь фонаря (слева от персонажа — контровой свет)
const WC=[.5,.33], WR=.32;                // круг неба: центр, половина стороны картинки (uv.x)
const SKYRECT=[WC[0]-WR, WC[1]-WR*PA, WR*2, WR*2*PA];
const LW=.27, LANTRECT=[L[0]-.49*LW, L[1]-.60*LW*PA, LW, LW*PA];   // огонь фонаря в картинке — (0.49, 0.60)
const cw=CARD.h*CARD.asp*(H/W), RECT=[CARD.cx-cw/2, CARD.by-CARD.h, cw, CARD.h];
// ---------- типографика: каждая буква — свой слой
function split(id,txt){ const el=$(id); el.textContent=''; return [...txt].map(c=>{ const s=document.createElement('span'); s.className='ch'; s.textContent=c; el.appendChild(s); return s; }); }
const T={ date:split('date','05.06.1997'), k1:split('k1','НЕБО В МИТЬ ТВОГО НАРОДЖЕННЯ'), d1:split('d1','05.06.1997 · 05:10'), c1:split('c1','ХАРКІВ'),
          c2:split('c2','Вісім систем — одна карта'), kick:split('kick','ІМ’Я ТВОЄЇ КАРТИ'), nm:split('nm',CARD.name), sub:split('sub',CARD.sub) };
$('act').textContent=CARD.act; $('seal').style.backgroundImage=`url(${CARD.seal})`;
function letters(arr,t,a,b,o={}){ const st=o.st??.028, din=o.din??.5, dout=o.dout??.35, n=arr.length, mid=(n-1)/2;
  arr.forEach((s,i)=>{ const k=o.center?Math.abs(i-mid):i, pin=eo5(seg(t,a+k*st,a+k*st+din)), pout=b==null?0:ei(seg(t,b+k*st*.5,b+k*st*.5+dout));
    s.style.opacity=pin*(1-pout); s.style.transform=`translateY(${(1-pin)*(o.dy??14)-pout*10}px) scale(${.92+.08*pin})`; s.style.filter=pin<1||pout>0?`blur(${(1-pin)*6+pout*5}px)`:'none'; }); }
// ---------- медальоны систем: DOM-спрайты, позиция — через ту же геометрию, что и шейдер
const SYSEL=SYS.map(n=>{ const im=new Image(); im.src='layers/sys_'+n+'.webp'; $('sys').appendChild(im); return im; });
let zoomNow=1, sNow=1, cNow=[.5,.5-112/H], mNow=cNow;
function uvToScr(u,t){ const dr=[Math.sin(t*.21)*.004, Math.cos(t*.17)*.003];
  return [ (cNow[0] + ((u[0]-dr[0]-L[0])*zoomNow + L[0] - mNow[0])*sNow)*W, (cNow[1] + ((u[1]-dr[1]-L[1])*zoomNow + L[1] - mNow[1])*sNow)*H ]; }
// ---------- круг неба: слой Gemini + планеты на градусах. АСЦ слева, знаки против часовой; prog — проявление по кругу, планеты летят от огонька на свои градусы
const SKC=document.createElement('canvas'); SKC.width=SKC.height=1024; const skx=SKC.getContext('2d');
const IMG={}; function img(k,src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>{ IMG[k]=i; r(); }; i.src=src; }); }
const SKP=SKY.planets.map(p=>{ const a=Math.PI-(p[1]-SKY.asc)*Math.PI/180; return {k:p[0],w:p[2],a,ord:((Math.PI/2-a)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)}; }).sort((x,y)=>x.ord-y.ord);
function drawSky(prog,fly,glow){ const c=skx, cx=512, cy=512, R=512*.78, A0=-Math.PI/2; c.clearRect(0,0,1024,1024);
  // круг проявляется по дуге от верхней точки в обе стороны
  c.save(); c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,560,A0-Math.PI*prog,A0+Math.PI*prog); c.closePath(); c.clip();
  c.globalAlpha=.95; c.drawImage(IMG.wheel,0,0,1024,1024); c.restore(); c.globalAlpha=1;
  // огонёк в координатах круга — откуда летят планеты
  const sx=(L[0]-SKYRECT[0])/SKYRECT[2]*1024, sy=(L[1]-SKYRECT[1])/SKYRECT[3]*1024;
  SKP.forEach((p,i)=>{ const k=eo(cl(fly-i*.55)); if(k<=0) return; const tx=cx+R*Math.cos(p.a), ty=cy+R*Math.sin(p.a);
    const x=sx+(tx-sx)*k, y=sy+(ty-sy)*k - Math.sin(k*Math.PI)*60, s=38*p.w*(.6+.4*k), pop=1+.5*Math.sin(cl((fly-i*.55-1)*3)*Math.PI);
    const g=c.createRadialGradient(x,y,0,x,y,s*1.6*pop); g.addColorStop(0,'rgba(255,224,160,'+(.5*glow*k)+')'); g.addColorStop(1,'rgba(255,180,90,0)'); c.fillStyle=g; c.beginPath(); c.arc(x,y,s*1.6*pop,0,6.283); c.fill();
    c.globalAlpha=cl(k*2); c.drawImage(IMG.planets, PL.indexOf(p.k)*96,0,96,96, x-s/2*pop, y-s/2*pop, s*pop, s*pop); c.globalAlpha=1; });
}
let skyKey='';
function skyTex(prog,fly,glow){ const key=prog.toFixed(3)+'|'+fly.toFixed(2)+'|'+glow.toFixed(2); if(key===skyKey) return; skyKey=key; drawSky(prog,fly,glow);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,skyT); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,SKC); }
// ---------- WebGL
const cv=$('gl'), gl=cv.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:REC});
const DPR=Math.min(2,devicePixelRatio||1); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 vUv;void main(){vUv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,$('fs').textContent)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);

const skyT=gl.createTexture(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,skyT); texParams(false);

function render(t){

  const dz=seg(t,.15,.85); T.date.forEach((s,i)=>{ const k=i-(T.date.length-1)/2; s.style.opacity=1-ei(dz); s.style.transform=`translateX(${-k*19*eio(dz)}px) scale(${1-.5*dz})`; s.style.filter=`blur(${dz*5}px)`; });

  const spark=eo(seg(t,.8,1.3))*(1+.6*seg(t,4.7,5.4))*(1-seg(t,5.6,6.2));
  const lan=.15*seg(t,1.2,2)+.35*eio(seg(t,4.7,5.4))-.35*seg(t,5.3,6.1)+ .85*eo(seg(t,6.3,6.5))+.15*seg(t,6.5,7.5);

  gl.uniform1f(U.uAmb,.05*seg(t,7,9)); gl.uniform2f(U.uPar,par[0],par[1]); gl.uniform4f(U.uRect,...RECT);
  gl.uniform4f(U.uSkyRect,...SKYRECT); gl.uniform1f(U.uSkyA,seg(t,2.2,2.5));
  gl.uniform4f(U.uLantRect,...LANTRECT); gl.uniform1f(U.uLantA,eo(seg(t,5.4,6.1))); gl.uniform1f(U.uLantOn,eo(seg(t,6.25,6.45)));
  gl.uniform1f(U.uS,S); gl.uniform1f(U.uSc,SC); gl.uniform1f(U.uCardA,eo(seg(t,9.7,10.5)));

  SYSEL.forEach((im,i)=>{ const a=-Math.PI/2+i*Math.PI/4, ring=[WC[0]+.47*Math.cos(a), WC[1]+.47*PA*Math.sin(a)];
    const pin=eo(seg(t,4.0+i*.09,4.45+i*.09)), pgo=ei(seg(t,4.75+i*.06,5.35+i*.03));
    const u=[ring[0]+(L[0]-ring[0])*pgo, ring[1]+(L[1]-ring[1])*pgo], p=uvToScr(u,t), sc=(.4+.6*pin)*(1-pgo*.9);

  letters(T.c2,t,4.35,5.15,{st:.022,din:.45});

  const sp=seg(t,10.6,10.95); Object.assign($('seal').style,{left:(fx+fw-52)+'px',top:(fy+fh-48)+'px',opacity:cl(sp*5),transform:`scale(${2.4-1.4*back(sp)}) rotate(${(1-eo(sp))*-18}deg)`});

// ---------- запуск
function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); $('st').style.transform=`scale(${s})`; }
let t0=0, run=false, au=null, fr=0, fT=0, worst=0, mark=0;
function loop(){ if(!run) return; const now=performance.now(), t=au&&!au.paused?au.currentTime:(now-t0)/1000; render(Math.min(t,DUR));
  // замер (?fps): кадров в секунду и худший кадр — для шага «скорость на телефоне»
  if(Q.has('fps')){ if(fT) worst=Math.max(worst,now-fT); fT=now; if(++fr%60===0){ $('fps').textContent=`${(60000/(now-mark)).toFixed(0)} fps · найгірший кадр ${worst.toFixed(0)} мс`; mark=now; worst=0; } }
  requestAnimationFrame(loop); }
function start(from){ $('play').style.display='none'; t0=performance.now()-from*1000; mark=performance.now(); if(au){ au.currentTime=from; au.play().catch(()=>{}); } if(navigator.vibrate&&!from) setTimeout(()=>navigator.vibrate(40),6400); run=true; loop(); }

  addEventListener('deviceorientation',e=>{ parT=[cl((e.gamma||0)/25,-1,1), cl(((e.beta||45)-45)/25,-1,1)]; });
