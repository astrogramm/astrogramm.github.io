<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Astrogramm · Открытие карты (прототип WOW)</title>
<style>
@font-face{font-family:'Cormorant';font-weight:600;src:url(fonts/cormorant-garamond-cyrillic-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant';font-weight:500;font-style:italic;src:url(fonts/cormorant-garamond-cyrillic-500-italic.woff2) format('woff2')}
@font-face{font-family:'Unbounded';font-weight:300;src:url(fonts/unbounded-cyrillic-300-normal.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#06051a;color:#f1edf8;overflow:hidden;font-family:'Cormorant',serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(40px + env(safe-area-inset-bottom));text-align:center}
#card{position:fixed;left:50%;top:44%;width:min(62vw,300px);aspect-ratio:4/5;transform:translate(-50%,-50%) translateY(60px) scale(.92);opacity:0;border-radius:18px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(233,196,106,.5),0 0 60px rgba(233,196,106,.25),0 30px 80px rgba(0,0,0,.7);transition:opacity 1.4s cubic-bezier(.2,.8,.2,1),transform 1.6s cubic-bezier(.2,.8,.2,1);will-change:transform}
#card img{width:100%;height:100%;object-fit:cover;display:block}
#card:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.35) 50%,transparent 70%);transform:translateX(-120%);}
body.born #card{opacity:1;transform:translate(-50%,-50%) translateY(0) scale(1)}
body.born #card:after{animation:shine 1.6s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes shine{to{transform:translateX(120%)}}
.kick{font-family:'Unbounded';font-weight:300;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#c9a94a;opacity:0;transform:translateY(12px);transition:all .9s .9s}
.nm{font-size:44px;line-height:1.05;color:#ffd76b;margin-top:10px;text-shadow:0 0 30px rgba(255,215,107,.45)}
.nm span{display:inline-block;opacity:0;transform:translateY(14px) rotate(-3deg);filter:blur(6px);transition:all .7s cubic-bezier(.2,.8,.2,1)}
.sub{font-style:italic;font-weight:500;font-size:18px;color:#e0dbee;opacity:0;transition:opacity 1s 2.6s;max-width:320px;margin-top:8px}
body.born .kick{opacity:1;transform:none}body.born .sub{opacity:1}
#hint{position:fixed;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-family:'Unbounded';font-size:9px;letter-spacing:.3em;color:rgba(201,169,74,.55);text-transform:uppercase}
#tap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06051a;z-index:9;flex-direction:column;gap:14px;cursor:pointer}
#tap b{font-family:'Unbounded';font-weight:300;letter-spacing:.42em;font-size:14px;color:#e9c46a}
#tap i{font-size:20px;color:#aea6cc}
#again{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));font-family:'Unbounded';font-size:9px;letter-spacing:.2em;color:rgba(201,169,74,.6);background:none;border:1px solid rgba(201,169,74,.3);border-radius:999px;padding:8px 14px;opacity:0;transition:opacity 1s 3s;pointer-events:none}
body.born #again{opacity:1;pointer-events:auto}
</style></head><body>
<div id="tap"><b>ASTROGRAMM</b><i>нажми — открыть карту</i></div>
<div id="hint">наклони телефон</div>
<div id="card"><img id="face" src="name_yin_13.webp" alt=""></div>
<div id="ui"><div class="kick">имя твоей карты</div><div class="nm" id="nm"></div><div class="sub">идёшь туда, куда другие боятся смотреть, и возвращаешься с картой</div></div>
<button id="again">ещё раз</button>
<script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ---------- card data (prototype: founder-like sample; in the app these come from the core) ---------- */
const NAME='Тигр-Странник';
const PLANETS=[['sun',75,.78],['moon',102,.62],['mercury',62,.55],['venus',110,.7],['mars',160,.86],['jupiter',320,1.0],['saturn',22,1.12],['uranus',305,1.22],['neptune',298,1.3],['pluto',244,1.4]]; // key, ecliptic lon, orbit radius factor
const ASC=83;

/* ---------- renderer ---------- */
const R=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'}); R.setPixelRatio(Math.min(2,devicePixelRatio)); R.setSize(innerWidth,innerHeight); R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05; document.body.prepend(R.domElement);
const S=new THREE.Scene(); S.fog=new THREE.FogExp2(0x06051a,.055);
const CAM=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200); CAM.position.set(0,0,10);
const rig=new THREE.Group(); rig.add(CAM); S.add(rig);

/* ---------- textures ---------- */
const TL=new THREE.TextureLoader();
function dot(size=64,inner=0){ const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'); const g=x.createRadialGradient(size/2,size/2,inner,size/2,size/2,size/2); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,240,200,.6)'); g.addColorStop(1,'rgba(255,220,150,0)'); x.fillStyle=g; x.fillRect(0,0,size,size); const t=new THREE.CanvasTexture(c); return t; }
const DOT=dot();

/* ---------- layer 1: deep star tunnel (we fall through it) ---------- */
function stars(n,spread,depth,size,col){ const g=new THREE.BufferGeometry(); const p=new Float32Array(n*3), s=new Float32Array(n);
  for(let i=0;i<n;i++){ p[i*3]=(Math.random()-.5)*spread; p[i*3+1]=(Math.random()-.5)*spread; p[i*3+2]=-Math.random()*depth; s[i]=Math.random(); }
  g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('seed',new THREE.BufferAttribute(s,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{t:{value:0},map:{value:DOT},size:{value:size},col:{value:new THREE.Color(col)},pr:{value:R.getPixelRatio()}},
    vertexShader:`attribute float seed;uniform float t,size,pr;varying float a;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);float tw=.6+.4*sin(t*(1.+seed*2.)+seed*40.);a=tw*smoothstep(-90.,-20.,mv.z);gl_PointSize=size*pr*(.5+seed)*(30./-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D map;uniform vec3 col;varying float a;void main(){vec4 c=texture2D(map,gl_PointCoord);gl_FragColor=vec4(col*c.rgb,c.a*a);}`});
  const pts=new THREE.Points(g,m); pts.userData.depth=depth; return pts; }
const L1=stars(2600,90,120,2.2,'#dfe6ff'), L2=stars(900,60,120,3.4,'#ffe9c0'), L3=stars(260,30,120,5,'#ffd76b');
S.add(L1,L2,L3);

/* ---------- nebula: soft additive sprites in depth ---------- */
const nebG=new THREE.Group(); S.add(nebG);
for(let i=0;i<26;i++){ const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:dot(128,0),color:i%3?0x5a3ad0:0x2a4ad8,transparent:true,opacity:.07+Math.random()*.05,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.position.set((Math.random()-.5)*50,(Math.random()-.5)*30,-10-Math.random()*70); const s=10+Math.random()*22; sp.scale.set(s,s,1); nebG.add(sp); }

/* ---------- layer 2: the sky — zodiac ring + planets ---------- */
const sky=new THREE.Group(); sky.position.set(0,.4,0); sky.rotation.x=-.9; sky.visible=false; S.add(sky);
const RING=2.6;
const ringGeo=new THREE.BufferGeometry(); { const n=1200, p=new Float32Array(n*3), s=new Float32Array(n); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, r=RING+(i%3?0:.0)+(Math.random()-.5)*.03; p[i*3]=Math.cos(a)*r; p[i*3+1]=Math.sin(a)*r; p[i*3+2]=(Math.random()-.5)*.02; s[i]=i/n; } ringGeo.setAttribute('position',new THREE.BufferAttribute(p,3)); ringGeo.setAttribute('seed',new THREE.BufferAttribute(s,1)); }
const ringMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{t:{value:0},draw:{value:0},map:{value:DOT},pr:{value:R.getPixelRatio()}},
  vertexShader:`attribute float seed;uniform float draw,pr;varying float a;void main(){a=step(seed,draw)*(1.-smoothstep(draw-.03,draw,seed)*.0);vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=3.2*pr*(10./-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D map;varying float a;void main(){vec4 c=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vec3(.98,.86,.5)*c.rgb,c.a*a*.9);}`});
sky.add(new THREE.Points(ringGeo,ringMat));
// 12 spokes
const spokes=new THREE.Group(); sky.add(spokes);
for(let i=0;i<12;i++){ const a=i*Math.PI/6; const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Math.cos(a)*RING*.84,Math.sin(a)*RING*.84,0),new THREE.Vector3(Math.cos(a)*RING,Math.sin(a)*RING,0)]); const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xd9b967,transparent:true,opacity:0})); spokes.add(l); }
// planets: glowing sprite with textured disc
const PL=[];
PLANETS.forEach(([k,lon,rf],i)=>{ const grp=new THREE.Group();
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:k==='sun'?0xffe08a:0xcfd8ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})); glow.scale.set(k==='sun'?1.1:.6,k==='sun'?1.1:.6,1); grp.add(glow);
  const tex=TL.load(`../illustrations/planet/planet_${k}_400.webp`); tex.colorSpace=THREE.SRGBColorSpace;
  const disc=new THREE.Mesh(new THREE.CircleGeometry(k==='sun'?.26:.16,40),new THREE.MeshBasicMaterial({map:tex,transparent:true})); grp.add(disc);
  const trailG=new THREE.BufferGeometry(); const tp=new Float32Array(40*3); trailG.setAttribute('position',new THREE.BufferAttribute(tp,3)); const trail=new THREE.Line(trailG,new THREE.LineBasicMaterial({color:0xffe6b0,transparent:true,opacity:.0})); sky.add(trail);
  const a=Math.PI+(lon-ASC)*Math.PI/180, r=RING*.84*rf*.72; grp.userData={a,r,start:1.9+i*.28,a0:a+Math.PI*1.6,r0:RING*2.4+i*.4,trail,hist:[]}; grp.visible=false; sky.add(grp); PL.push(grp); });
// core light
const core=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xfff2d0,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false})); core.scale.set(.5,.5,1); sky.add(core);

/* ---------- gold dust (always) ---------- */
const DUST=stars(500,16,40,3,'#ffd76b'); DUST.position.z=8; S.add(DUST);

/* ---------- god rays behind the card (phase 5) ---------- */
const rays=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{t:{value:0},k:{value:0}},
  vertexShader:`varying vec2 v;void main(){v=uv-.5;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float t,k;varying vec2 v;void main(){float a=atan(v.y,v.x);float r=length(v);float ray=pow(.5+.5*sin(a*11.+t*.25),9.)*.45+pow(.5+.5*sin(a*5.-t*.15),12.)*.35;float f=smoothstep(.5,.08,r)*smoothstep(.0,.12,r)*k;gl_FragColor=vec4(vec3(1.,.86,.5)*ray*f,ray*f*.55);}`}));
rays.position.set(0,.3,-1.5); S.add(rays);

/* ---------- post: bloom + grain/vignette ---------- */
const comp=new EffectComposer(R); comp.addPass(new RenderPass(S,CAM));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.9,.6,.2); comp.addPass(bloom);
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},t:{value:0},flash:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float t,flash;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+t)*43758.5453);}
  void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float d=distance(vUv,vec2(.5));c*=smoothstep(.95,.35,d);c+=(h(vUv)-.5)*.045;c=mix(c,vec3(1.,.97,.9),flash);gl_FragColor=vec4(c,1.);}`}); comp.addPass(grade);

/* ---------- parallax: gyro / mouse ---------- */
let tx=0,ty=0; addEventListener('mousemove',e=>{ tx=(e.clientX/innerWidth-.5)*2; ty=(e.clientY/innerHeight-.5)*2; });
function gyro(e){ if(e.gamma==null) return; tx=Math.max(-1,Math.min(1,e.gamma/25)); ty=Math.max(-1,Math.min(1,(e.beta-45)/25)); }
async function askGyro(){ try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){ const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') return; } addEventListener('deviceorientation',gyro); }catch(e){} }

/* ---------- timeline ---------- */
const E=t=>t<0?0:t>1?1:1-Math.pow(1-t,3), EI=t=>t<0?0:t>1?1:t*t*t, EIO=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const T_SKY=1.6, T_PULL=6.2, T_FLASH=7.3, T_BORN=7.6;
const FIX=+(new URLSearchParams(location.search).get('t')||0); /* debug: freeze timeline at second t */
let t0=0, started=false, born=false, px=0, py=0;
const nm=document.getElementById('nm'); nm.innerHTML=[...NAME].map((ch,i)=>`<span style="transition-delay:${.5+i*.06}s">${ch==='-'?'-':ch}</span>`).join('');
function start(){ t0=performance.now(); started=true; born=false; document.body.classList.remove('born'); nm.querySelectorAll('span').forEach(s=>s.style.cssText+=';opacity:0;transform:translateY(14px) rotate(-3deg);filter:blur(6px)'); sky.visible=false; PL.forEach(p=>{ p.visible=false; p.userData.hist=[]; }); ringMat.uniforms.draw.value=0; rays.material.uniforms.k.value=0; core.material.opacity=0; bloom.strength=.9; }
let audio; function thump(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const a=audio, o=a.createOscillator(), g=a.createGain(), n=a.createBufferSource(), nb=a.createBuffer(1,a.sampleRate*1.2,a.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); n.buffer=nb; const ng=a.createGain(), f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; ng.gain.value=.25; n.connect(f).connect(ng).connect(a.destination);
  o.type='sine'; o.frequency.setValueAtTime(110,a.currentTime); o.frequency.exponentialRampToValueAtTime(36,a.currentTime+1.4); g.gain.setValueAtTime(.9,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.8); o.connect(g).connect(a.destination); o.start(); n.start(); o.stop(a.currentTime+1.9); }catch(e){} }
document.getElementById('tap').addEventListener('click',()=>{ askGyro(); document.getElementById('tap').style.display='none'; start(); });
document.getElementById('again').addEventListener('click',start);

function frame(now){ requestAnimationFrame(frame); const t=now/1000; if(!started){ comp.render(); return; } const s=FIX?FIX:(now-t0)/1000;
  px+=(tx-px)*.06; py+=(ty-py)*.06;
  // phase 1: fall — camera speed decays into phase 2
  const speed=18*(1-E(s/2.6))+1.2;
  [L1,L2,L3,DUST].forEach((L,i)=>{ const pos=L.geometry.attributes.position; const dz=speed*(i===3?.35:1)*(1/60); const dep=L.userData.depth; for(let k=2;k<pos.array.length;k+=3){ pos.array[k]+=dz; if(pos.array[k]>CAM.position.z) pos.array[k]-=dep; } pos.needsUpdate=true; L.material.uniforms.t.value=t; L.position.x=px*(.6+i*.5); L.position.y=-py*(.4+i*.3); });
  nebG.position.x=px*1.4; nebG.position.y=-py*.9; nebG.rotation.z=t*.01;
  rig.rotation.y=-px*.05; rig.rotation.x=py*.04;
  // phase 2: sky assembles
  if(s>T_SKY){ sky.visible=true; const k=E((s-T_SKY)/2.2); ringMat.uniforms.draw.value=k; ringMat.uniforms.t.value=t; spokes.children.forEach((l,i)=>{ l.material.opacity=.55*E((s-T_SKY-.6-i*.1)/.8); });
    sky.rotation.z=(s-T_SKY)*.06; sky.rotation.x=-.9+.35*EIO((s-T_SKY)/3); sky.position.x=px*.25; sky.position.y=.4-py*.2;
    PL.forEach(p=>{ const u=p.userData, q=EIO((s-u.start)/1.6); if(q<=0) return; p.visible=true; const a=u.a0+(u.a-u.a0)*q, r=u.r0+(u.r-u.r0)*q; p.position.set(Math.cos(a)*r,Math.sin(a)*r,.05+.4*(1-q)); p.lookAt(CAM.position); u.hist.unshift(p.position.clone()); if(u.hist.length>40) u.hist.pop(); const tp=u.trail.geometry.attributes.position; for(let i=0;i<40;i++){ const v=u.hist[Math.min(i,u.hist.length-1)]; tp.array[i*3]=v.x; tp.array[i*3+1]=v.y; tp.array[i*3+2]=v.z; } tp.needsUpdate=true; u.trail.material.opacity=q<1?.5:Math.max(0,u.trail.material.opacity-.03); if(q>=1){ const land=s-u.start-1.6; if(land<.6) p.children[0].scale.setScalar((p===PL[0]?1.1:.6)*(1+land*2)); } });
    core.material.opacity=.3*E((s-3.5)/2.5); }
  // phase 3: pull — everything spirals into the centre, bloom rises
  if(s>T_PULL){ const g=EI((s-T_PULL)/(T_FLASH-T_PULL)); sky.scale.setScalar(Math.max(.001,1-g)); sky.rotation.z+=g*.12; core.material.opacity=.3+g*1.2; core.scale.setScalar(.5+g*2.2); bloom.strength=.9+g*1.6; R.toneMappingExposure=1.05+g*.6; }
  // phase 4: flash
  const f=s-T_FLASH; grade.uniforms.flash.value=f>0&&f<1.2?Math.sin(Math.min(1,f/1.2)*Math.PI)*(f<.25?1:.5):0; if(f>0&&f<.05&&!born){ thump(); }
  if(s>T_FLASH+.15){ sky.visible=false; bloom.strength=1.0; R.toneMappingExposure=1.05; }
  // phase 5: born
  if(s>T_BORN&&!born){ born=true; document.body.classList.add('born'); nm.querySelectorAll('span').forEach(s=>{ s.style.opacity=1; s.style.transform='none'; s.style.filter='none'; }); }
  if(born){ rays.material.uniforms.t.value=t; rays.material.uniforms.k.value=E((s-T_BORN)/1.8)*(.55+.1*Math.sin(t*2)); rays.position.x=px*.3; const card=document.getElementById('card'); card.style.transform=`translate(-50%,-50%) perspective(900px) rotateY(${px*8}deg) rotateX(${-py*6}deg)`; }
  grade.uniforms.t.value=t; comp.render(); }
requestAnimationFrame(frame);
addEventListener('resize',()=>{ R.setSize(innerWidth,innerHeight); CAM.aspect=innerWidth/innerHeight; CAM.updateProjectionMatrix(); comp.setSize(innerWidth,innerHeight); });
</script></body></html>
